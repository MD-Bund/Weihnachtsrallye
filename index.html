
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <meta name="theme-color" content="#004b6e">

  <title>Weihnachtsrallye des MD Bund</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --dunkelblau: #004b6e;
      --blau: #06688f;
      --tuerkis: #0099c6;
      --helltuerkis: #5ec4e1;
      --hellblau: #d5ecf4;
      --gruen: #3e8825;
      --orange: #d96b24;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      margin: 0;
      font-family: Calibri, Arial, sans-serif;
      color: var(--dunkelblau);
      background: #eaf6fa;
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid var(--gruen);
      outline-offset: 3px;
    }

    .versteckt {
      display: none !important;
    }

    /*
      HINTERGRUND

      Das Hintergrundbild behält sein
      ursprüngliches Seitenverhältnis.

      Dadurch wird das Logo nicht mehr
      gestreckt, wenn eine Station
      besonders viel Text enthält.
    */

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 0 20px 32px;

      background-color: #eaf6fa;
      background-image: url("hintergrund.png");
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% auto;
    }

    .logo-abstand {
      height: clamp(150px, 22svh, 220px);
    }

    /*
      KARTEN-BUTTON
    */

    .karte-button {
      position: sticky;
      top: 12px;
      z-index: 20;
      float: right;
      margin-top: 12px;
      padding: 11px 15px;
      border: 0;
      border-radius: 25px;
      background: var(--dunkelblau);
      color: white;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 3px 10px #004b6e33;
    }

    .karte-button[hidden] {
      display: none;
    }

    .karte-abstand {
      clear: both;
    }

    /*
      KÄSTEN UND TEXTE
    */

    .kasten {
      margin-bottom: 14px;
      padding: 19px 17px;
      border-radius: 17px;
      box-shadow: 0 3px 12px #004b6e14;
    }

    .kasten-weiss {
      background: rgba(255, 255, 255, 0.97);
    }

    .kasten-fakt {
      background: #d5ecf4;
      border-left: 5px solid var(--blau);
    }

    .kasten-challenge {
      background: var(--tuerkis);
      color: white;
    }

    .zentriert {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.3;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.25;
    }

    h3 {
      margin: 0 0 12px;
      font-size: 19px;
      line-height: 1.3;
    }

    p {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.5;
    }

    p:last-child {
      margin-bottom: 0;
    }

    /*
      STARTSEITE
    */

    .routen {
      display: grid;
      gap: 12px;
    }

    .route {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 90px;
      padding: 16px;
      text-align: left;
      color: var(--dunkelblau);
      background: rgba(255, 255, 255, 0.97);
      border: 2px solid var(--hellblau);
      border-radius: 17px;
      box-shadow: 0 3px 12px #004b6e14;
    }

    .symbol {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      margin-right: 14px;
      border-radius: 12px;
      background: var(--hellblau);
      font-size: 24px;
    }

    .route-text {
      flex: 1;
    }

    .route-name {
      display: block;
      margin-bottom: 5px;
      font-size: 19px;
      font-weight: bold;
    }

    .route-info {
      display: block;
      color: var(--blau);
      font-size: 15px;
    }

    .pfeil {
      color: var(--tuerkis);
      font-size: 26px;
    }

    /*
      STATIONSINHALTE
    */

    .fortschritt {
      margin-bottom: 10px;
      color: var(--blau);
      font-size: 14px;
      font-weight: bold;
    }

    .station-titel {
      margin-bottom: 22px;
    }

    .weg-titel {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .stationsfoto {
      display: block;
      width: 100%;
      height: auto;
      max-height: 310px;
      object-fit: cover;
      margin-top: 17px;
      border-radius: 12px;
    }

    .fakt-titel {
      color: var(--dunkelblau);
    }

    .kasten-fakt p {
      font-size: 16px;
    }

    .challenge-titel {
      color: white;
    }

    .kasten-challenge p {
      color: white;
    }

    /*
      BUTTONS
    */

    .button {
      display: block;
      width: 100%;
      padding: 15px 18px;
      border: 0;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
    }

    .button-weiter {
      margin-top: 20px;
      background: white;
      color: var(--dunkelblau);
      box-shadow: 0 3px 8px #004b6e20;
    }

    .button-zurueck {
      margin-top: 14px;
      border: 2px solid var(--hellblau);
      background: white;
      color: var(--dunkelblau);
    }

    /*
      INTERAKTIVE KARTE
    */

    .karte {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: white;
    }

    .karte.offen {
      display: flex;
      flex-direction: column;
    }

    .karte-kopf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 10px;

      padding: 12px 14px;
      padding-top: max(
        12px,
        env(safe-area-inset-top)
      );

      background: var(--dunkelblau);
      color: white;
    }

    .karte-titel {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.3;
    }

    .karte-schliessen {
      flex-shrink: 0;
      padding: 12px 13px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: var(--dunkelblau);
      font-size: 14px;
      font-weight: bold;
    }

    #kartenflaeche {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .karte-fuss {
      flex-shrink: 0;
      padding: 12px 14px;
      padding-bottom: max(
        12px,
        env(safe-area-inset-bottom)
      );

      background: white;
      border-top: 1px solid var(--hellblau);
    }

    .karte-zurueck {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--dunkelblau);
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .kartenhinweis {
      margin-top: 8px;
      color: var(--blau);
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    @media (min-width: 600px) {
      .app {
        box-shadow: 0 0 35px #004b6e22;
      }
    }

    @media (max-width: 360px) {
      .karte-titel {
        font-size: 13px;
      }

      .karte-schliessen {
        padding: 11px 9px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- KARTEN-BUTTON -->

    <button
      id="karteButton"
      class="karte-button"
      type="button"
      onclick="karteOeffnen()"
      hidden
    >
      🗺 Karte
    </button>

    <div class="karte-abstand"></div>
    <div class="logo-abstand"></div>

    <!-- STARTSEITE -->

    <section id="startseite">

      <div class="kasten kasten-weiss zentriert">
        <h1>
          Strecke wählen und Weihnachtsrallye starten
        </h1>
      </div>

      <nav class="routen" aria-label="Routenauswahl">

        <button
          class="route"
          type="button"
          onclick="routeWaehlen('kurz')"
        >
          <span class="symbol">❄️</span>

          <span class="route-text">
            <span class="route-name">
              Die kurze Runde
            </span>

            <span class="route-info">
              620 m · ca. 20 Min.
            </span>
          </span>

          <span class="pfeil">›</span>
        </button>

        <button
          class="route"
          type="button"
          onclick="routeWaehlen('mittel')"
        >
          <span class="symbol">🎄</span>

          <span class="route-text">
            <span class="route-name">
              Die mittlere Runde
            </span>

            <span class="route-info">
              1,08 km · ca. 30 Min.
            </span>
          </span>

          <span class="pfeil">›</span>
        </button>

        <button
          class="route"
          type="button"
          onclick="routeWaehlen('lang')"
        >
          <span class="symbol">⭐</span>

          <span class="route-text">
            <span class="route-name">
              Die lange Runde
            </span>

            <span class="route-info">
              2,3 km · ca. 60 Min.
            </span>
          </span>

          <span class="pfeil">›</span>
        </button>

      </nav>

    </section>

    <!-- WARTESEITE -->

    <section
      id="warteseite"
      class="versteckt"
    >

      <div class="kasten kasten-weiss zentriert">

        <h2>❄️ Noch etwas Geduld!</h2>

        <p>
          Strecke wird noch vom Schnee geräumt.
          Bitte warten Sie noch etwas.
        </p>

        <button
          class="button button-zurueck"
          type="button"
          onclick="zurStartseite()"
        >
          ← Zur Streckenauswahl
        </button>

      </div>

    </section>

    <!-- STATIONSSEITE -->

    <section
      id="stationsseite"
      class="versteckt"
    >

      <!-- WEISSER KASTEN -->

      <div class="kasten kasten-weiss">

        <div
          id="fortschritt"
          class="fortschritt"
        ></div>

        <h2
          id="stationTitel"
          class="station-titel"
        ></h2>

        <h3 class="weg-titel">
          🧭 Wegbeschreibung
        </h3>

        <div id="stationWeg"></div>

        <div id="stationFoto"></div>

      </div>

      <!-- HELLBLAUER FAKTENKASTEN -->

      <div
        id="faktKasten"
        class="kasten kasten-fakt versteckt"
      >

        <h3
          id="faktTitel"
          class="fakt-titel"
        ></h3>

        <div id="stationFakt"></div>

      </div>

      <!-- TÜRKISFARBENER CHALLENGE-KASTEN -->

      <div
        id="challengeKasten"
        class="kasten kasten-challenge"
      >

        <h3
          id="challengeTitel"
          class="challenge-titel"
        >
          📸 Foto-Challenge
        </h3>

        <div id="stationChallenge"></div>

        <button
          id="weiterButton"
          class="button button-weiter"
          type="button"
          onclick="naechsteStation()"
        >
          📸 Foto gemacht · Weiter
        </button>

      </div>

      <!-- ZURÜCK -->

      <button
        class="button button-zurueck"
        type="button"
        onclick="vorherigeStation()"
      >
        ← Zurück
      </button>

    </section>

  </main>

  <!-- KARTENFENSTER -->

  <div
    id="kartenfenster"
    class="karte"
    role="dialog"
    aria-modal="true"
    aria-label="Streckenkarte"
    aria-hidden="true"
  >

    <div class="karte-kopf">

      <span class="karte-titel">
        🗺 Kurze Runde<br>
        Streckenkarte
      </span>

      <button
        id="karteSchliessenOben"
        class="karte-schliessen"
        type="button"
        onclick="karteSchliessen()"
      >
        ✕ Zurück zur Rallye
      </button>

    </div>

    <div id="kartenflaeche"></div>

    <div class="karte-fuss">

      <button
        class="karte-zurueck"
        type="button"
        onclick="karteSchliessen()"
      >
        ← Zurück zur Rallye
      </button>

      <div class="kartenhinweis">
        Die Karte dient zur Orientierung.
        Bitte vor Ort auf die Wege achten.
      </div>

    </div>

  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>

    // ==========================================
    // STATIONEN DER KURZEN RUNDE
    // ==========================================

    const stationen = [

      // STATION 1
      {
        titel: "Die orangefarbene Rolltreppe",

          <p>

        `,

        foto: "rolltreppe.jpg",

        fotoAlt:
          "Orangefarbene Rolltreppe auf Zollverein",

        faktTitel:

        fakt: `
          <p>
            Der Platz wurde 2020 nach dem

            aus dem Steinkohlenbergbau.
          </p>
        `,

        challengeTitel: "📸 Foto-Challenge",

        challenge: `
          <p>
            Das Erklimmen der Karriereleiter

          </p>

          <p>
            <strong>Fotomotiv:</strong>
            Gruppenfoto auf der Rolltreppe,
            möglichst auf unterschiedlichen Stufen.
          </p>
        `
      },

      // STATION 2
      {
        titel: "Zollverein aus der Vogelperspektive",

        weg: `
          <p>
            Oben angekommen wartet das gläserne
            Modell der Zeche Zollverein.
          </p>

          <p>
            Hier lässt sich das Gelände aus
            einer ganz anderen Perspektive
            betrachten.
          </p>
        `,

        foto: "",
        faktTitel: "",
        fakt: "",

        challengeTitel:
          "📸 Mit den Augen des Weihnachtsmanns",

        challenge: `
          <p>
            So ungefähr sieht der Weihnachtsmann
            Zollverein, wenn er mit seinem
            Schlitten darüberfliegt.
          </p>

          <p>
            Fotografiert eure Gruppe mit dem

            als würde er gerade die Flugroute
            für den Schlitten planen.
          </p>
        `
      },

      // STATION 3
      {
        titel: "Das Rad nicht neu erfinden",

        weg: `
          <p>
            Mit der Rolltreppe geht es
            wieder hinunter.
          </p>

          <p>
            Unten links halten, auf das
            Gebäude zugehen und links
            daran vorbeilaufen.
          </p>

          <p>
            Dort stehen zwei große
            historische Räder.
          </p>
        `,

        foto: "",
        faktTitel: "",
        fakt: "",

        challengeTitel:
          "📸 Das Rad nicht neu erfinden",

        challenge: `
          <p>
            Warum das Rad neu erfinden,
            wenn hier schon ziemlich
            beeindruckende Exemplare stehen?
          </p>

          <p>
            <strong>Euer Auftrag:</strong>
            Versammelt euch für ein Gruppenfoto
            rund um das historische Rad.
            Wer möchte, kann so tun,
            als würde er es mit vereinten

          </p>
        `
      },

      // STATION 4
      {
        titel: "Red Dot Design Museum",

        weg: `
          <p>
            Dem Weg bis zum Ende des Gebäudes
            folgen und rechts abbiegen.
          </p>

          <p>
            Auf der linken Seite befindet
            sich das Red Dot Design Museum.
          </p>
        `,

        foto: "",
        faktTitel: "",
        fakt: "",

        challengeTitel:
          "📸 Ausgezeichnetes Design",

        challenge: `
          <p>
            Für ein gutes Gruppenfoto braucht
            es nicht unbedingt einen Designpreis.
            Aber ein bisschen Kreativität
            schadet nicht.
          </p>

          <p>
            Gestaltet ein Gruppenfoto,
            das auch in einer Designausstellung
            bestehen könnte.
          </p>
        `
      },

      // STATION 5
      {
        titel: "Die Engel am Casino",

        weg: `
          <p>
            Weiter geht es bis zur nächsten

          </p>

          <p>

          </p>

          <p>

          </p>
        `,

        foto: "",
        faktTitel: "",
        fakt: "",

        challengeTitel:
          "📸 Engel mit Köpfchen",

        challenge: `
          <p>
            Die beiden Engel könnten etwas

          </p>

      },

      // STATION 6
      {
        titel: "Das Doppelbock-Fördergerüst",

        weg: `

            Zurück zur Querstraße und

          </p>

          <p>
            Vor uns erhebt sich das

            das Wahrzeichen von Zollverein.
          </p>
        `,

        foto: "",
        faktTitel: "",
        fakt: "",

        challengeTitel:
          "📸 Ein starkes Team",

        challenge: `
          <p>
            Ein gemeinsames Gruppenfoto
            vor dem berühmtesten Motiv
            der Zeche darf natürlich

          </p>

            Sucht euch einen schönen
            Bildausschnitt, auf dem sowohl

          </p>
        `
      },

      // ZIEL
      {
        titel: "Geschafft! 🎄",

        weg: `
          <p>
            Links am Doppelbock-Fördergerüst
            vorbei geht es zurück zum
            großen Platz.
          </p>

          <p>
            Auf der linken Seite befindet
            sich wieder <strong>The Mine</strong>.
          </p>

          <p>
            Die kurze Weihnachtsrallye
            ist damit beendet.
          </p>

          <p>
            Viel Spaß bei der Weihnachtsfeier!
          </p>
        `,

        foto: "",
        faktTitel: "",
        fakt: "",
        challengeTitel: "",
        challenge: ""
      }
    ];


    // ==========================================
    // FORTSCHRITT SPEICHERN
    // ==========================================

    const SPEICHER_SCHLUESSEL =
      "md-bund-weihnachtsrallye-2026";

    let aktuelleRoute = null;
    let aktuelleStation = 0;

    function fortschrittSpeichern() {

      if (!aktuelleRoute) {
        return;
      }

      try {

        localStorage.setItem(
          SPEICHER_SCHLUESSEL,
          JSON.stringify({
            route: aktuelleRoute,
            station: aktuelleStation
          })
        );

      } catch (fehler) {

        console.warn(
          "Fortschritt konnte nicht gespeichert werden:",
          fehler
        );
      }
    }

    function fortschrittLaden() {

      try {

        const gespeichert =
          localStorage.getItem(
            SPEICHER_SCHLUESSEL
          );

        if (!gespeichert) {
          return false;
        }

        const daten = JSON.parse(gespeichert);

        if (
          !daten ||
          !["kurz", "mittel", "lang"].includes(daten.route)
        ) {
          return false;
        }

        aktuelleRoute = daten.route;

        if (aktuelleRoute === "kurz") {

          const nummer = Number(daten.station);

          aktuelleStation =
            Number.isInteger(nummer)
              ? Math.max(
                  0,
                  Math.min(
                    nummer,
                    stationen.length - 1
                  )
                )
              : 0;

          stationAnzeigen();

        } else {

          seitenAusblenden();

          document.getElementById("warteseite")
            .classList.remove("versteckt");

          document.getElementById("karteButton")
            .hidden = true;
        }

        return true;

      } catch (fehler) {

        console.warn(
          "Gespeicherter Fortschritt ungültig:",
          fehler
        );

        return false;
      }
    }


    // ==========================================
    // SEITENSTEUERUNG
    // ==========================================

    function seitenAusblenden() {

      document.getElementById("startseite")
        .classList.add("versteckt");

      document.getElementById("warteseite")
        .classList.add("versteckt");

      document.getElementById("stationsseite")
        .classList.add("versteckt");
    }

    function routeWaehlen(route) {

      aktuelleRoute = route;
      aktuelleStation = 0;

      fortschrittSpeichern();
      seitenAusblenden();

      if (route === "kurz") {

        stationAnzeigen();

      } else {

        document.getElementById("warteseite")
          .classList.remove("versteckt");

        document.getElementById("karteButton")
          .hidden = true;
      }

      window.scrollTo(0, 0);
    }

    function stationAnzeigen() {

      seitenAusblenden();

      document.getElementById("stationsseite")
        .classList.remove("versteckt");

      const station = stationen[aktuelleStation];

      const istAbschluss =
        aktuelleStation === stationen.length - 1;

      document.getElementById("stationTitel")
        .textContent = station.titel;

      document.getElementById("fortschritt")
        .textContent = istAbschluss
          ? "Ziel erreicht"
          : "Station " + (aktuelleStation + 1) +
            " von " + (stationen.length - 1);

      // WEGBESCHREIBUNG

      document.getElementById("stationWeg")
        .innerHTML = station.weg;

      // FOTO

      const fotoBereich =
        document.getElementById("stationFoto");

      fotoBereich.innerHTML = "";

      if (station.foto) {

        const bild = document.createElement("img");

        bild.className = "stationsfoto";
        bild.src = station.foto;
        bild.alt = station.fotoAlt || station.titel;
        bild.loading = "lazy";

        fotoBereich.appendChild(bild);
      }

      // FAKT

      const faktKasten =
        document.getElementById("faktKasten");

      if (station.fakt) {

        faktKasten.classList.remove("versteckt");

        document.getElementById("faktTitel")
          .textContent =
            "💡 " + station.faktTitel;

        document.getElementById("stationFakt")
          .innerHTML = station.fakt;

      } else {

        faktKasten.classList.add("versteckt");
      }

      // FOTO-CHALLENGE

      const challengeTitel =
        document.getElementById("challengeTitel");

      const challengeInhalt =
        document.getElementById("stationChallenge");

      if (station.challenge) {

        challengeTitel.textContent =
          station.challengeTitel ||
          "📸 Foto-Challenge";

        challengeInhalt.innerHTML =
          station.challenge;

      } else {

        challengeTitel.textContent =
          "🎄 Rallye beendet";

        challengeInhalt.innerHTML = `
          <p>
            Schön, dass ihr dabei wart!
          </p>
        `;
      }

      // WEITER-BUTTON

      const weiter =
        document.getElementById("weiterButton");

      weiter.textContent = istAbschluss
        ? "Zur Streckenauswahl"
        : "📸 Foto gemacht · Weiter";

      // KARTEN-BUTTON

      document.getElementById("karteButton")
        .hidden = false;

      // SPEICHERN

      fortschrittSpeichern();

      window.scrollTo(0, 0);
    }

    function naechsteStation() {

      if (
        aktuelleStation <
        stationen.length - 1
      ) {

        aktuelleStation++;
        stationAnzeigen();

      } else {

        zurStartseite();
      }
    }

    function vorherigeStation() {

      if (aktuelleStation > 0) {

        aktuelleStation--;
        stationAnzeigen();

      } else {

        zurStartseite();
      }
    }

    function zurStartseite() {

      if (karteIstOffen()) {
        karteSchliessen();
      }

      aktuelleRoute = null;
      aktuelleStation = 0;

      try {

        localStorage.removeItem(
          SPEICHER_SCHLUESSEL
        );

      } catch (fehler) {

        console.warn(fehler);
      }

      seitenAusblenden();

      document.getElementById("startseite")
        .classList.remove("versteckt");

      document.getElementById("karteButton")
        .hidden = true;

      window.scrollTo(0, 0);
    }


    // ==========================================
    // INTERAKTIVE KARTE
    // ==========================================

    let karte = null;
    let streckeGeladen = false;
    let streckeWirdGeladen = false;

    let scrollpositionVorKarte = 0;
    let kartenVerlaufAktiv = false;

    function karteIstOffen() {

      return document.getElementById(
        "kartenfenster"
      ).classList.contains("offen");
    }

    async function karteOeffnen() {

      if (karteIstOffen()) {
        return;
      }

      scrollpositionVorKarte = window.scrollY;

      const fenster =
        document.getElementById("kartenfenster");

      fenster.classList.add("offen");

      fenster.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow = "hidden";

      history.pushState(
        { weihnachtsrallyeKarte: true },
        "",
        window.location.href
      );

      kartenVerlaufAktiv = true;

      document.getElementById(
        "karteSchliessenOben"
      ).focus();

      if (typeof L === "undefined") {

        alert(
          "Die Kartenbibliothek konnte nicht " +
          "geladen werden. Bitte die " +
          "Internetverbindung prüfen."
        );

        return;
      }

      if (!karte) {

        karte = L.map("kartenflaeche");

        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap"
          }
        ).addTo(karte);

        karte.setView(
          [51.486, 7.043],
          16
        );
      }

      setTimeout(() => {

        karte.invalidateSize();

      }, 150);

      if (
        streckeGeladen ||
        streckeWirdGeladen
      ) {
        return;
      }

      streckeWirdGeladen = true;

      try {

        const antwort = await fetch(
          "kurz.gpx",
          { cache: "no-store" }
        );

        if (!antwort.ok) {

          throw new Error(
            "GPX-Datei nicht erreichbar: HTTP " +
            antwort.status
          );
        }

        const gpxText = await antwort.text();

        const xml = new DOMParser()
          .parseFromString(
            gpxText,
            "application/xml"
          );

        if (
          xml.getElementsByTagName(
            "parsererror"
          ).length > 0
        ) {

          throw new Error(
            "Die GPX-Datei enthält ungültiges XML."
          );
        }

        let elemente = Array.from(
          xml.getElementsByTagName("trkpt")
        );

        if (elemente.length < 2) {

          elemente = Array.from(
            xml.getElementsByTagName("rtept")
          );
        }

        const punkte = elemente
          .map(element => [

            Number(
              element.getAttribute("lat")
            ),

            Number(
              element.getAttribute("lon")
            )

          ])
          .filter(punkt =>

            Number.isFinite(punkt[0]) &&
            Number.isFinite(punkt[1]) &&
            Math.abs(punkt[0]) <= 90 &&
            Math.abs(punkt[1]) <= 180

          );

        if (punkte.length < 2) {

          throw new Error(
            "Die GPX-Datei enthält keine " +
            "ausreichenden Streckenpunkte."
          );
        }

        const linie = L.polyline(
          punkte,
          {
            color: "#0099c6",
            weight: 6,
            opacity: 0.95
          }
        ).addTo(karte);

        L.circleMarker(
          punkte[0],
          {
            radius: 8,
            color: "#004b6e",
            fillColor: "#3e8825",
            fillOpacity: 1
          }
        )
        .addTo(karte)
        .bindPopup("Start: The Mine");

        L.circleMarker(
          punkte[punkte.length - 1],
          {
            radius: 7,
            color: "#004b6e",
            fillColor: "#d96b24",
            fillOpacity: 1
          }
        )
        .addTo(karte)
        .bindPopup("Ziel der Route");

        karte.fitBounds(
          linie.getBounds(),
          {
            padding: [30, 30]
          }
        );

        streckeGeladen = true;

      } catch (fehler) {

        console.error(
          "Fehler beim Laden der GPX-Strecke:",
          fehler
        );

        alert(
          "Die Strecke konnte nicht geladen werden.\n\n" +
          fehler.message +
          "\n\nBitte prüfen, ob kurz.gpx " +
          "im GitHub-Repository liegt."
        );

      } finally {

        streckeWirdGeladen = false;
      }
    }

    function kartenansichtAusblenden() {

      const fenster =
        document.getElementById("kartenfenster");

      fenster.classList.remove("offen");

      fenster.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow = "";

      window.scrollTo(
        0,
        scrollpositionVorKarte
      );

      const kartenButton =
        document.getElementById("karteButton");

      if (!kartenButton.hidden) {
        kartenButton.focus();
      }
    }

    function karteSchliessen() {

      if (!karteIstOffen()) {
        return;
      }

      kartenansichtAusblenden();

      if (
        kartenVerlaufAktiv &&
        history.state &&
        history.state.weihnachtsrallyeKarte
      ) {

        kartenVerlaufAktiv = false;
        history.back();

      } else {

        kartenVerlaufAktiv = false;
      }
    }

    window.addEventListener(
      "popstate",
      function (ereignis) {

        if (karteIstOffen()) {

          if (
            !ereignis.state ||
            !ereignis.state.weihnachtsrallyeKarte
          ) {

            kartenVerlaufAktiv = false;
            kartenansichtAusblenden();
          }

        } else {

          kartenVerlaufAktiv = false;
        }
      }
    );

    document.addEventListener(
      "keydown",
      function (ereignis) {

        if (
          ereignis.key === "Escape" &&
          karteIstOffen()
        ) {

          karteSchliessen();
        }
      }
    );


    // ==========================================
    // WEBSITE STARTEN
    // ==========================================

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        fortschrittLaden();

      }
    );

  </script>

</body>
