
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta name="theme-color" content="#004b6e">

  <title>Weihnachtsrallye des MD Bund</title>

  <!-- Leaflet für die interaktive Karte -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --dunkelblau: #004b6e;
      --blau: #06688f;
      --tuerkis: #0099c6;
      --helltuerkis: #5ec4e1;
      --hellblau: #d5ecf4;
      --gruen: #3e8825;
      --orange: #d96b24;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Calibri, Arial, sans-serif;
      color: var(--dunkelblau);
      background: var(--hellblau);
    }

    button {
      font-family: inherit;
      cursor: pointer;
    }

    button:focus-visible {
      outline: 3px solid var(--gruen);
      outline-offset: 3px;
    }

    .versteckt {
      display: none !important;
    }

    /* HAUPTSEITE */

    .app {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0 auto;
      padding: 0 20px 32px;

      background-image: url("hintergrund.png");
      background-repeat: no-repeat;
      background-position: center top;
      background-size: 100% 100%;
    }

    .logo-abstand {
      height: clamp(150px, 22svh, 220px);
    }

    /* KARTEN-BUTTON AUF DER RALLYESEITE */

    .karte-button {
      position: sticky;
      top: 12px;
      z-index: 20;
      float: right;
      margin-top: 12px;
      padding: 11px 15px;
      border: 0;
      border-radius: 25px;
      background: var(--dunkelblau);
      color: white;
      font-size: 15px;
      font-weight: bold;
      box-shadow: 0 3px 10px #004b6e33;
    }

    .karte-button[hidden] {
      display: none;
    }

    .karte-abstand {
      clear: both;
    }

    /* INHALTSKARTEN */

    .kasten {
      margin-bottom: 16px;
      padding: 20px 17px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 3px 14px #004b6e14;
    }

    .zentriert {
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 23px;
      line-height: 1.3;
    }

    h2 {
      margin: 0 0 12px;
      font-size: 23px;
      line-height: 1.25;
    }

    h3 {
      margin: 20px 0 8px;
      font-size: 18px;
    }

    p {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.5;
    }

    p:last-child {
      margin-bottom: 0;
    }

    /* ROUTENAUSWAHL */

    .routen {
      display: grid;
      gap: 12px;
    }

    .route {
      display: flex;
      align-items: center;
      width: 100%;
      min-height: 90px;
      padding: 16px;
      text-align: left;
      color: var(--dunkelblau);
      background: rgba(255, 255, 255, 0.96);
      border: 2px solid var(--hellblau);
      border-radius: 17px;
      box-shadow: 0 3px 12px #004b6e14;
    }

    .symbol {
      display: grid;
      place-items: center;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      margin-right: 14px;
      border-radius: 12px;
      background: var(--hellblau);
      font-size: 24px;
    }

    .route-text {
      flex: 1;
    }

    .route-name {
      display: block;
      margin-bottom: 5px;
      font-size: 19px;
      font-weight: bold;
    }

    .route-info {
      display: block;
      color: var(--blau);
      font-size: 15px;
    }

    .pfeil {
      color: var(--tuerkis);
      font-size: 26px;
    }

    /* STATIONEN */

    .fortschritt {
      margin-bottom: 12px;
      color: var(--blau);
      font-size: 14px;
      font-weight: bold;
    }

    .stationsfoto {
      display: block;
      width: 100%;
      max-height: 310px;
      height: auto;
      object-fit: cover;
      margin: 14px 0 18px;
      border-radius: 13px;
    }

    .fakt {
      margin: 15px 0;
      padding: 13px;
      border-left: 4px solid var(--tuerkis);
      border-radius: 0 10px 10px 0;
      background: #d5ecf47a;
      font-size: 16px;
      line-height: 1.45;
    }

    .aufgabe {
      margin: 17px 0;
      padding: 15px;
      border-radius: 13px;
      background: #eaf6fa;
    }

    .aufgabe h3 {
      margin-top: 0;
    }

    .button {
      display: block;
      width: 100%;
      margin-top: 14px;
      padding: 15px 18px;
      border: 0;
      border-radius: 13px;
      background: var(--tuerkis);
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .button-zurueck {
      border: 2px solid var(--hellblau);
      background: white;
      color: var(--dunkelblau);
    }

    /* KARTENFENSTER */

    .karte {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: white;
    }

    .karte.offen {
      display: flex;
      flex-direction: column;
    }

    .karte-kopf {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      gap: 10px;

      padding: 12px 14px;
      padding-top: max(
        12px,
        env(safe-area-inset-top)
      );

      background: var(--dunkelblau);
      color: white;
    }

    .karte-titel {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.25;
    }

    .karte-schliessen {
      flex-shrink: 0;
      padding: 12px 13px;
      border: 0;
      border-radius: 10px;
      background: white;
      color: var(--dunkelblau);
      font-size: 14px;
      font-weight: bold;
    }

    #kartenflaeche {
      flex: 1;
      min-height: 0;
      width: 100%;
    }

    .karte-fuss {
      flex-shrink: 0;
      padding: 12px 14px;
      padding-bottom: max(
        12px,
        env(safe-area-inset-bottom)
      );

      background: white;
      border-top: 1px solid var(--hellblau);
    }

    .karte-zurueck {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: var(--dunkelblau);
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .kartenhinweis {
      margin-top: 8px;
      color: var(--blau);
      font-size: 12px;
      line-height: 1.35;
      text-align: center;
    }

    @media (min-width: 600px) {
      .app {
        box-shadow: 0 0 35px #004b6e22;
      }
    }

    @media (max-width: 360px) {
      .karte-titel {
        font-size: 13px;
      }

      .karte-schliessen {
        font-size: 12px;
        padding: 11px 9px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <!-- BUTTON ZUM ÖFFNEN DER KARTE -->

    <button
      id="karteButton"
      class="karte-button"
      type="button"
      onclick="karteOeffnen()"
      hidden
    >
      🗺 Karte
    </button>

    <div class="karte-abstand"></div>
    <div class="logo-abstand"></div>

    <!-- STARTSEITE -->

    <section id="startseite">

      <div class="kasten zentriert">
        <h1>
          Strecke wählen und Weihnachtsrallye starten
        </h1>
      </div>

      <nav class="routen" aria-label="Routenauswahl">

        <button
          class="route"
          type="button"
          onclick="routeWaehlen('kurz')"
        >
          <span class="symbol">❄️</span>

          <span class="route-text">
            <span class="route-name">
              Die kurze Runde
            </span>

            <span class="route-info">
              620 m · ca. 20 Min.
            </span>
          </span>

          <span class="pfeil">›</span>
        </button>

        <button
          class="route"
          type="button"
          onclick="routeWaehlen('mittel')"
        >
          <span class="symbol">🎄</span>

          <span class="route-text">
            <span class="route-name">
              Die mittlere Runde
            </span>

            <span class="route-info">
              1,08 km · ca. 30 Min.
            </span>
          </span>

          <span class="pfeil">›</span>
        </button>

        <button
          class="route"
          type="button"
          onclick="routeWaehlen('lang')"
        >
          <span class="symbol">⭐</span>

          <span class="route-text">
            <span class="route-name">
              Die lange Runde
            </span>

            <span class="route-info">
              2,3 km · ca. 60 Min.
            </span>
          </span>

          <span class="pfeil">›</span>
        </button>

      </nav>

    </section>

    <!-- WARTESEITE FÜR MITTEL UND LANG -->

    <section
      id="warteseite"
      class="versteckt"
    >

      <div class="kasten zentriert">

        <h2>❄️ Noch etwas Geduld!</h2>

        <p>
          Strecke wird noch vom Schnee geräumt.
          Bitte warten Sie noch etwas.
        </p>

        <button
          class="button button-zurueck"
          type="button"
          onclick="zurStartseite()"
        >
          ← Zur Streckenauswahl
        </button>

      </div>

    </section>

    <!-- STATIONSSEITE -->

    <section
      id="stationsseite"
      class="versteckt"
    >

      <div class="kasten">

        <div
          id="fortschritt"
          class="fortschritt"
        ></div>

        <h2 id="stationTitel"></h2>

        <div id="stationInhalt"></div>

        <button
          id="weiterButton"
          class="button"
          type="button"
          onclick="naechsteStation()"
        >
          📸 Foto gemacht · Weiter
        </button>

        <button
          class="button button-zurueck"
          type="button"
          onclick="vorherigeStation()"
        >
          ← Zurück
        </button>

      </div>

    </section>

  </main>

  <!--
    INTERAKTIVE KARTE

    WICHTIG:
    Die Schließen-Buttons liegen außerhalb
    der Leaflet-Karte. Dadurch bleiben sie
    jederzeit anklickbar.
  -->

  <div
    id="kartenfenster"
    class="karte"
    role="dialog"
    aria-modal="true"
    aria-label="Streckenkarte"
    aria-hidden="true"
  >

    <div class="karte-kopf">

      <span class="karte-titel">
        🗺 Kurze Runde<br>
        Streckenkarte
      </span>

      <button
        id="karteSchliessenOben"
        class="karte-schliessen"
        type="button"
        onclick="karteSchliessen()"
      >
        ✕ Zurück zur Rallye
      </button>

    </div>

    <div id="kartenflaeche"></div>

    <div class="karte-fuss">

      <button
        class="karte-zurueck"
        type="button"
        onclick="karteSchliessen()"
      >
        ← Zurück zur Rallye
      </button>

      <div class="kartenhinweis">
        Die Karte dient zur Orientierung.
        Bitte vor Ort auf die Wege achten.
      </div>

    </div>

  </div>

  <!-- LEAFLET -->

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  ></script>

  <script>

    // ==========================================
    // STATIONEN DER KURZEN RUNDE
    // ==========================================

    const stationen = [

      // STATION 1
      {
        titel: "Die orangefarbene Rolltreppe",

        inhalt: `
          <h3>Wegbeschreibung</h3>

          <p>
            Vom The Mine geht es jetzt quer
            über den Werner-Müller-Platz.
          </p>

          <p>
            Auf der gegenüberliegenden Seite
            ist die orangefarbene Rolltreppe
            zu sehen. Am Fuß der Rolltreppe
            befindet sich unser erster Stopp.
          </p>

          <img
            class="stationsfoto"
            src="rolltreppe.jpg"
            alt="Die orangefarbene Rolltreppe auf Zollverein"
            loading="lazy"
          >

          <div class="fakt">

            <strong>
              Wer war eigentlich Werner Müller?
            </strong>

            <br><br>

            Der Platz wurde 2020 nach dem Essener
            Werner Müller (1946–2019) benannt.
            Als Bundeswirtschaftsminister und
            späterer RAG-Chef prägte er den
            Strukturwandel im Ruhrgebiet und
            den sozialverträglichen Ausstieg
            aus dem Steinkohlenbergbau.

          </div>

          <div class="aufgabe">

            <h3>📸 Foto-Challenge</h3>

            <p>
              Das Erklimmen der Karriereleiter
              kann anstrengend sein, nehmen wir
              lieber die Rolltreppe.
            </p>

            <p>
              <strong>Fotomotiv:</strong>
              Gruppenfoto auf der Rolltreppe,
              möglichst auf unterschiedlichen Stufen.
            </p>

          </div>
        `
      },

      // STATION 2
      {
        titel: "Zollverein aus der Vogelperspektive",

        inhalt: `
          <h3>Wegbeschreibung</h3>

          <p>
            Oben angekommen wartet das gläserne
            Modell der Zeche Zollverein.
          </p>

          <p>
            Hier lässt sich das Gelände
            aus einer ganz anderen Perspektive
            betrachten.
          </p>

          <div class="aufgabe">

            <h3>
              📸 Mit den Augen des Weihnachtsmanns
            </h3>

            <p>
              So ungefähr sieht der Weihnachtsmann
              Zollverein, wenn er mit seinem
              Schlitten darüberfliegt.
            </p>

            <p>
              Fotografiert eure Gruppe mit dem Modell.
              Wer möchte, kann so tun, als würde
              er gerade die Flugroute für den
              Schlitten planen.
            </p>

          </div>
        `
      },

      // STATION 3
      {
        titel: "Das Rad nicht neu erfinden",

        inhalt: `
          <h3>Wegbeschreibung</h3>

          <p>
            Mit der Rolltreppe geht es
            wieder hinunter.
          </p>

          <p>
            Unten links halten, auf das Gebäude
            zugehen und links daran vorbeilaufen.
          </p>

          <p>
            Dort stehen zwei große historische Räder.
          </p>

          <div class="aufgabe">

            <h3>
              📸 Das Rad nicht neu erfinden
            </h3>

            <p>
              Warum das Rad neu erfinden,
              wenn hier schon ziemlich
              beeindruckende Exemplare stehen?
            </p>

            <p>
              <strong>Euer Auftrag:</strong>
              Versammelt euch für ein Gruppenfoto
              rund um das historische Rad.
              Wer möchte, kann so tun, als würde
              er es mit vereinten Kräften
              in Bewegung setzen.
            </p>

          </div>
        `
      },

      // STATION 4
      {
        titel: "Red Dot Design Museum",

        inhalt: `
          <h3>Wegbeschreibung</h3>

          <p>
            Dem Weg bis zum Ende des Gebäudes
            folgen und rechts abbiegen.
          </p>

          <p>
            Auf der linken Seite befindet sich
            das Red Dot Design Museum.
          </p>

          <div class="aufgabe">

            <h3>📸 Ausgezeichnetes Design</h3>

            <p>
              Für ein gutes Gruppenfoto braucht
              es nicht unbedingt einen Designpreis.
              Aber ein bisschen Kreativität
              schadet nicht.
            </p>

            <p>
              Gestaltet ein Gruppenfoto,
              das auch in einer Designausstellung
              bestehen könnte.
            </p>

          </div>
        `
      },

      // STATION 5
      {
        titel: "Die Engel am Casino",

        inhalt: `
          <h3>Wegbeschreibung</h3>

          <p>
            Weiter geht es bis zur nächsten
            Querstraße.
          </p>

          <p>
            Dort führt ein kurzer Abstecher
            nach links zum Casino Zollverein.
          </p>

          <p>
            Hier stehen zwei Engelsfiguren
            ohne Köpfe.
          </p>

          <div class="aufgabe">

            <h3>📸 Engel mit Köpfchen</h3>

            <p>
              Die beiden Engel könnten etwas
              Unterstützung gebrauchen.
            </p>

            <p>
              Positioniert zwei Personen
              so hinter den Figuren, dass
              deren Köpfe auf dem Foto
              zu den Engelskörpern passen.
            </p>

          </div>
        `
      },

      // STATION 6
      {
        titel: "Das Doppelbock-Fördergerüst",

        inhalt: `
          <h3>Wegbeschreibung</h3>

          <p>
            Zurück zur Querstraße und
            dem Weg weiter folgen.
          </p>

          <p>
            Vor uns erhebt sich das
            Doppelbock-Fördergerüst,
            das Wahrzeichen von Zollverein.
          </p>

          <div class="aufgabe">

            <h3>📸 Ein starkes Team</h3>

            <p>
              Ein gemeinsames Gruppenfoto
              vor dem berühmtesten Motiv
              der Zeche darf natürlich
              nicht fehlen.
            </p>

            <p>
              Sucht euch einen schönen
              Bildausschnitt, auf dem
              sowohl die Gruppe als auch
              das Fördergerüst zu sehen sind.
            </p>

          </div>
        `
      },

      // ZIEL
      {
        titel: "Geschafft! 🎄",

        inhalt: `
          <h3>Der Rückweg</h3>

          <p>
            Links am Doppelbock-Fördergerüst
            vorbei geht es zurück zum
            großen Platz.
          </p>

          <p>
            Auf der linken Seite befindet
            sich wieder <strong>The Mine</strong>.
          </p>

          <p>
            Die kurze Weihnachtsrallye
            ist damit beendet.
          </p>

          <p>
            Viel Spaß bei der Weihnachtsfeier!
          </p>
        `
      }
    ];


    // ==========================================
    // FORTSCHRITT SPEICHERN
    // ==========================================

    const SPEICHER_SCHLUESSEL =
      "md-bund-weihnachtsrallye-2026";

    let aktuelleRoute = null;
    let aktuelleStation = 0;

    function fortschrittSpeichern() {

      if (!aktuelleRoute) {
        return;
      }

      const daten = {
        route: aktuelleRoute,
        station: aktuelleStation
      };

      try {

        localStorage.setItem(
          SPEICHER_SCHLUESSEL,
          JSON.stringify(daten)
        );

      } catch (fehler) {

        console.warn(
          "Fortschritt konnte nicht gespeichert werden:",
          fehler
        );
      }
    }

    function fortschrittLaden() {

      try {

        const gespeichert =
          localStorage.getItem(
            SPEICHER_SCHLUESSEL
          );

        if (!gespeichert) {
          return false;
        }

        const daten = JSON.parse(gespeichert);

        if (
          !daten ||
          !["kurz", "mittel", "lang"].includes(daten.route)
        ) {
          return false;
        }

        aktuelleRoute = daten.route;

        if (aktuelleRoute === "kurz") {

          const nummer = Number(daten.station);

          aktuelleStation =
            Number.isInteger(nummer)
              ? Math.max(
                  0,
                  Math.min(
                    nummer,
                    stationen.length - 1
                  )
                )
              : 0;

          stationAnzeigen();

        } else {

          seitenAusblenden();

          document.getElementById("warteseite")
            .classList.remove("versteckt");

          document.getElementById("karteButton")
            .hidden = true;
        }

        return true;

      } catch (fehler) {

        console.warn(
          "Gespeicherter Fortschritt ungültig:",
          fehler
        );

        return false;
      }
    }


    // ==========================================
    // SEITENSTEUERUNG
    // ==========================================

    function seitenAusblenden() {

      document.getElementById("startseite")
        .classList.add("versteckt");

      document.getElementById("warteseite")
        .classList.add("versteckt");

      document.getElementById("stationsseite")
        .classList.add("versteckt");
    }

    function routeWaehlen(route) {

      aktuelleRoute = route;
      aktuelleStation = 0;

      fortschrittSpeichern();
      seitenAusblenden();

      if (route === "kurz") {

        stationAnzeigen();

      } else {

        document.getElementById("warteseite")
          .classList.remove("versteckt");

        document.getElementById("karteButton")
          .hidden = true;
      }

      window.scrollTo(0, 0);
    }

    function stationAnzeigen() {

      seitenAusblenden();

      document.getElementById("stationsseite")
        .classList.remove("versteckt");

      const station = stationen[aktuelleStation];

      document.getElementById("stationTitel")
        .textContent = station.titel;

      document.getElementById("stationInhalt")
        .innerHTML = station.inhalt;

      const istAbschluss =
        aktuelleStation === stationen.length - 1;

      document.getElementById("fortschritt")
        .textContent = istAbschluss
          ? "Ziel erreicht"
          : "Station " + (aktuelleStation + 1) +
            " von " + (stationen.length - 1);

      const weiter =
        document.getElementById("weiterButton");

      weiter.textContent = istAbschluss
        ? "Zur Streckenauswahl"
        : "📸 Foto gemacht · Weiter";

      document.getElementById("karteButton")
        .hidden = false;

      fortschrittSpeichern();

      window.scrollTo(0, 0);
    }

    function naechsteStation() {

      if (
        aktuelleStation <
        stationen.length - 1
      ) {

        aktuelleStation++;
        stationAnzeigen();

      } else {

        zurStartseite();
      }
    }

    function vorherigeStation() {

      if (aktuelleStation > 0) {

        aktuelleStation--;
        stationAnzeigen();

      } else {

        zurStartseite();
      }
    }

    function zurStartseite() {

      if (karteIstOffen()) {
        karteSchliessen();
      }

      aktuelleRoute = null;
      aktuelleStation = 0;

      // Nur bei bewusster Rückkehr zur
      // Streckenauswahl wird der Stand gelöscht.

      try {

        localStorage.removeItem(
          SPEICHER_SCHLUESSEL
        );

      } catch (fehler) {

        console.warn(fehler);
      }

      seitenAusblenden();

      document.getElementById("startseite")
        .classList.remove("versteckt");

      document.getElementById("karteButton")
        .hidden = true;

      window.scrollTo(0, 0);
    }


    // ==========================================
    // INTERAKTIVE KARTE
    // ==========================================

    let karte = null;
    let streckeGeladen = false;
    let streckeWirdGeladen = false;

    // Merkt sich die Scrollposition,
    // damit die Rallye genau dort
    // weitergeht, wo sie verlassen wurde.

    let scrollpositionVorKarte = 0;

    // Merkt sich, ob für die Karte ein
    // zusätzlicher Browser-Verlaufseintrag
    // angelegt wurde.

    let kartenVerlaufAktiv = false;

    function karteIstOffen() {

      return document.getElementById(
        "kartenfenster"
      ).classList.contains("offen");
    }

    async function karteOeffnen() {

      if (karteIstOffen()) {
        return;
      }

      scrollpositionVorKarte = window.scrollY;

      const fenster =
        document.getElementById("kartenfenster");

      fenster.classList.add("offen");

      fenster.setAttribute(
        "aria-hidden",
        "false"
      );

      document.body.style.overflow = "hidden";

      // Ein zusätzlicher Verlaufseintrag sorgt
      // dafür, dass die Zurück-Taste des Handys
      // zunächst die Karte schließt.

      if (!kartenVerlaufAktiv) {

        history.pushState(
          { weihnachtsrallyeKarte: true },
          "",
          window.location.href
        );

        kartenVerlaufAktiv = true;
      }

      document.getElementById(
        "karteSchliessenOben"
      ).focus();

      if (typeof L === "undefined") {

        alert(
          "Die Kartenbibliothek konnte nicht " +
          "geladen werden. Bitte die " +
          "Internetverbindung prüfen."
        );

        return;
      }

      if (!karte) {

        karte = L.map("kartenflaeche");

        L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 19,
            attribution: "&copy; OpenStreetMap"
          }
        ).addTo(karte);

        // Ausgangsansicht: Zollverein

        karte.setView(
          [51.486, 7.043],
          16
        );
      }

      setTimeout(() => {

        karte.invalidateSize();

      }, 150);

      if (
        streckeGeladen ||
        streckeWirdGeladen
      ) {
        return;
      }

      streckeWirdGeladen = true;

      try {

        const antwort = await fetch(
          "kurz.gpx",
          { cache: "no-store" }
        );

        if (!antwort.ok) {

          throw new Error(
            "GPX-Datei nicht erreichbar: HTTP " +
            antwort.status
          );
        }

        const gpxText = await antwort.text();

        const xml = new DOMParser()
          .parseFromString(
            gpxText,
            "application/xml"
          );

        if (
          xml.getElementsByTagName(
            "parsererror"
          ).length > 0
        ) {

          throw new Error(
            "Die GPX-Datei enthält ungültiges XML."
          );
        }

        // GPX-Tracks: trkpt
        // GPX-Routen: rtept

        let elemente = Array.from(
          xml.getElementsByTagName("trkpt")
        );

        if (elemente.length < 2) {

          elemente = Array.from(
            xml.getElementsByTagName("rtept")
          );
        }

        const punkte = elemente
          .map(element => [

            Number(
              element.getAttribute("lat")
            ),

            Number(
              element.getAttribute("lon")
            )

          ])
          .filter(punkt =>

            Number.isFinite(punkt[0]) &&
            Number.isFinite(punkt[1]) &&
            Math.abs(punkt[0]) <= 90 &&
            Math.abs(punkt[1]) <= 180

          );

        if (punkte.length < 2) {

          throw new Error(
            "Die GPX-Datei enthält keine " +
            "ausreichenden Streckenpunkte."
          );
        }

        const linie = L.polyline(
          punkte,
          {
            color: "#0099c6",
            weight: 6,
            opacity: 0.95
          }
        ).addTo(karte);

        L.circleMarker(
          punkte[0],
          {
            radius: 8,
            color: "#004b6e",
            fillColor: "#3e8825",
            fillOpacity: 1
          }
        )
        .addTo(karte)
        .bindPopup("Start: The Mine");

        L.circleMarker(
          punkte[punkte.length - 1],
          {
            radius: 7,
            color: "#004b6e",
            fillColor: "#d96b24",
            fillOpacity: 1
          }
        )
        .addTo(karte)
        .bindPopup("Ziel der Route");

        karte.fitBounds(
          linie.getBounds(),
          {
            padding: [30, 30]
          }
        );

        streckeGeladen = true;

      } catch (fehler) {

        console.error(
          "Fehler beim Laden der GPX-Strecke:",
          fehler
        );

        alert(
          "Die Strecke konnte nicht geladen werden.\n\n" +
          fehler.message +
          "\n\nBitte prüfen, ob kurz.gpx " +
          "im GitHub-Repository liegt."
        );

      } finally {

        streckeWirdGeladen = false;
      }
    }

    // Schließt die Karte optisch,
    // ohne die aktuelle Station zu ändern.

    function kartenansichtAusblenden() {

      const fenster =
        document.getElementById("kartenfenster");

      fenster.classList.remove("offen");

      fenster.setAttribute(
        "aria-hidden",
        "true"
      );

      document.body.style.overflow = "";

      window.scrollTo(
        0,
        scrollpositionVorKarte
      );

      document.getElementById(
        "karteButton"
      ).focus();
    }

    // Wird durch die beiden Buttons aufgerufen.

    function karteSchliessen() {

      if (!karteIstOffen()) {
        return;
      }

      kartenansichtAusblenden();

      // Den beim Öffnen erzeugten
      // Verlaufseintrag wieder entfernen.

      if (kartenVerlaufAktiv) {

        kartenVerlaufAktiv = false;

        if (
          history.state &&
          history.state.weihnachtsrallyeKarte
        ) {

          history.back();
        }
      }
    }

    // Reagiert auf die Zurück-Taste
    // des Smartphones beziehungsweise
    // des Browsers.

    window.addEventListener(
      "popstate",
      function () {

        if (karteIstOffen()) {

          kartenVerlaufAktiv = false;
          kartenansichtAusblenden();

        } else {

          kartenVerlaufAktiv = false;
        }
      }
    );

    // Auf Computern kann die Karte
    // zusätzlich mit Escape geschlossen werden.

    document.addEventListener(
      "keydown",
      function (ereignis) {

        if (
          ereignis.key === "Escape" &&
          karteIstOffen()
        ) {

          karteSchliessen();
        }
      }
    );


    // ==========================================
    // WEBSITE STARTEN
    // ==========================================

    document.addEventListener(
      "DOMContentLoaded",
      function () {

        // Gespeicherten Fortschritt laden.
        // Falls nichts gespeichert wurde,
        // bleibt die Streckenauswahl sichtbar.

        fortschrittLaden();

      }
    );

  </script>
